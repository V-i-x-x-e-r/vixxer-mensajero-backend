name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_URL: http://localhost
  SUPABASE_SERVICE_ROLE_KEY: ficticia-para-pruebas
  JWT_SECRET: ficticio-para-pruebas

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Tests
        run: python -m pytest tests/ -q

      - name: La app arranca
        run: python -c "from app.main import asgi; print('asgi ok')"
